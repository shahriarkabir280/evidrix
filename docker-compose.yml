services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evidrix
    ports:
      # Host 5433, because Homebrew Postgres already listens on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first created.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidrix"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
