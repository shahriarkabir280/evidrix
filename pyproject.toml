[project]
name = "evidrix"
version = "0.1.0"
description = "Evidence-grounded RAG knowledge assistant"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pdfminer-six>=20260107",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf[crypto]>=6.19.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs/ are illustrative snippets, not source to format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs Postgres/Redis",
    "live: calls real model providers",
    "model: loads a real local ML model (downloads it on first run)",
]

# On Linux (CI, Docker) install CPU-only torch; the default Linux wheels bundle several GB of
# NVIDIA CUDA libraries we never use. macOS keeps the normal PyPI wheel (with Apple MPS support).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
