[project]
name = "evidrix"
version = "0.1.0"
description = "Evidence-grounded RAG knowledge assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs/ are illustrative snippets, not source to format.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs Postgres/Redis",
    "live: calls real model providers",
]
