name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The chat page's rendering tests; Node is preinstalled on the runner.
      - run: node --test 'tests/ui/*.test.mjs'
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidrix_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evidrix_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evidrix_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check
      # Real-model tests download ~130 MB of weights and live tests need Ollama; both run locally.
      # Redis is not a service here: the tests use fakeredis.
      - run: uv run pytest -m "not model and not live" --cov=app --cov-report=term --cov-fail-under=85

  # Builds the production image without pushing it, so a broken Dockerfile fails the PR rather
  # than the deploy. The layer cache keeps the dependency and model layers between runs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: evidrix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
